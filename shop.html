<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080e">
  <meta name="description" content="Browse the PlayStation 4 and PlayStation 5 catalog at FCHKAL STORE.">
  <title>PlayStation Store | FCHKAL STORE</title>
  <link rel="icon" type="image/png" href="images/brand/fchkal-store-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="data/store-config.js"></script>
  <script defer src="data/games.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-base-path="./">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header class="site-header">
    <a class="brand-lockup" href="./" aria-label="FCHKAL STORE home">
      <img src="images/brand/fchkal-store-logo.png" alt="" width="44" height="44">
      <span>FCHKAL <b>STORE</b></span>
    </a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="shop.html">Store</a>
      <a href="plus.html">PlayStation Plus</a>
      <a href="./#reviews">Reviews</a>
    </nav>
    <div class="header-actions">
      <label class="sr-only" for="languageSelector" data-i18n="language">Language</label>
      <select id="languageSelector" class="language-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="ar">عربي</option>
      </select>
      <a class="header-whatsapp" href="https://wa.me/212636059783" target="_blank" rel="noopener noreferrer" data-i18n="orderWhatsApp">Order on WhatsApp</a>
      <button class="cart-trigger" id="cartButton" type="button" aria-label="Open shopping cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L21 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="main" class="content-shell">
    <section class="catalog-section" id="catalog" aria-labelledby="catalogTitle">
      <div class="section-heading catalog-heading">
        <div>
          <p class="section-overline">THE COLLECTION</p>
          <h1 id="catalogTitle">PlayStation Store</h1>
        </div>
        <span class="catalog-count" id="catalogCount">0</span>
      </div>

      <div class="platform-selector">
        <div class="selector-copy">
          <span class="selector-label">Choose your console</span>
          <p class="selector-note">Switch platforms to compare available games and prices.</p>
        </div>
        <div class="filter-group" role="group" aria-label="Filter by platform">
          <button type="button" class="filter-chip" data-filter-platform="PS5">PlayStation 5</button>
          <button type="button" class="filter-chip" data-filter-platform="PS4">PlayStation 4</button>
        </div>
      </div>

      <div class="catalog-tools">
        <label class="search-field">
          <span class="sr-only">Search games</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          <input id="searchInput" type="search" placeholder="Search games" autocomplete="off">
        </label>
        <label class="sort-field">
          <span class="sr-only">Sort games</span>
          <select id="sortFilter">
            <option value="new">New</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="gta-first">GTA VI first</option>
          </select>
        </label>
      </div>

      <div class="product-grid" id="gamesGrid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand-lockup footer-brand" href="./">
        <img src="images/brand/fchkal-store-logo.png" alt="" width="38" height="38">
        <span>FCHKAL <b>STORE</b></span>
      </a>
      <div class="footer-contact">
        <a href="https://wa.me/212636059783" target="_blank" rel="noopener noreferrer">WhatsApp · +212 636 059 783</a>
        <a href="https://www.instagram.com/fchkal___keys.ma/" target="_blank" rel="noopener noreferrer">@fchkal___keys.ma</a>
        <span>11:00–00:00</span>
      </div>
    </div>
  </footer>
</body>
</html>
